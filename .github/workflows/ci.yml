name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # A named image, not ubuntu-latest: a moving image can drop the pinned
    # Python and Node builds the jobs ask for.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      # Actions are pinned to a full commit so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token is not left on disk for install scripts to read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gate

  # Proves on a clean machine that the committed model is the one the code
  # trains, and that the browser scorer agrees with Python.
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest 3.12 patch. Local Windows runs 3.12.10, the last 3.12 release
      # with a Windows installer; this run is the check of record. The packages go
      # straight into the runner's own Python: it is thrown away after the run, so
      # a venv would isolate nothing.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.16
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tickets the model learns from are written by the web package.
      - run: npm ci
        working-directory: web
      - run: npm run export-data
        working-directory: web
      # Every package is pinned to the sha256 of its published wheels: an unlisted
      # package, a changed file or a source build is refused.
      - run: "pip install --require-hashes --only-binary :all: -r ml/requirements.txt"
      - run: pytest ml/tests
      # Written outside the checkout so the committed model stays what it is
      # compared with; the parity file goes to its usual place.
      - run: python -m triage.export_model --model-out "$RUNNER_TEMP/model.json"
        working-directory: ml
      # The whole model must match: the same classes and vocabulary, every weight
      # within a small tolerance (room for a fit on another machine to differ in
      # the last digits), then the same class on every ticket.
      - run: python -m triage.check_model "$RUNNER_TEMP/model.json" "$GITHUB_WORKSPACE/web/src/model/model.json"
        working-directory: ml
      # The numbers in eval.json come from this run, not from whoever last
      # committed them. Counts and row fingerprints must match, and the committed
      # report must clear the owner's accuracy floor.
      - run: python -m triage.evaluate --out "$RUNNER_TEMP/eval.json"
        working-directory: ml
      - run: python -m triage.check_eval "$RUNNER_TEMP/eval.json" "$GITHUB_WORKSPACE/ml/reports/eval.json"
        working-directory: ml
      # The browser scorer is judged on the model the parity file was made from.
      - run: npm run parity
        working-directory: web
        env:
          PARITY_MODEL: ${{ runner.temp }}/model.json
