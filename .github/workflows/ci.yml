name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # A named image, not ubuntu-latest: a moving image can drop the pinned
    # Python and Node builds the jobs ask for.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      # Actions are pinned to a full commit so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token is not left on disk for install scripts to read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gate
      # The page's browser tests, in the three engines a visitor may use. The
      # browsers come from the Playwright version the lockfile pins; --no never
      # fetches another.
      - run: npm exec --no -- playwright install --with-deps chromium firefox webkit
      - run: npm run e2e

  # Proves on a clean machine that the committed model is the one the code
  # trains, and that the browser scorer agrees with Python.
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A current 3.12 patch. Local Windows runs 3.12.10, the last 3.12 release
      # with a Windows installer; this run is the check of record. The packages go
      # straight into the runner's own Python: it is thrown away after the run, so
      # a venv would isolate nothing.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.16
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tickets the model learns from are written by the web package.
      - run: npm ci
        working-directory: web
      - run: npm run export-data
        working-directory: web
      # Every package is pinned to the sha256 of its published wheels: an unlisted
      # package, a changed file or a source build is refused.
      - run: "pip install --require-hashes --only-binary :all: -r ml/requirements.txt"
      - run: pytest ml/tests
      # Written outside the checkout so the committed model stays what it is
      # compared with; the parity file goes to its usual place.
      # The fold models are written beside it for the pipeline check below.
      - run: python -m triage.export_model --model-out "$RUNNER_TEMP/model.json" --folds-out "$RUNNER_TEMP/folds"
        working-directory: ml
      # The whole model must match: the same classes and vocabulary, every weight
      # within a small tolerance (room for a fit on another machine to differ in
      # the last digits), then the same class on every ticket.
      - run: python -m triage.check_model "$RUNNER_TEMP/model.json" "$GITHUB_WORKSPACE/web/src/model/model.json"
        working-directory: ml
      # The live page scores each run with a committed fold model, so each one is
      # held to its fresh retrain the same way. The shell stops at the first fold
      # that differs.
      - run: for k in 0 1 2 3; do python -m triage.check_model "$RUNNER_TEMP/folds/fold_$k.json" "$GITHUB_WORKSPACE/web/public/models/fold_$k.json"; done
        working-directory: ml
      # The numbers in eval.json come from this run, not from whoever last
      # committed them. Counts and row fingerprints must match, and the committed
      # report must clear the owner's accuracy floor.
      - run: python -m triage.evaluate --out "$RUNNER_TEMP/eval.json"
        working-directory: ml
      - run: python -m triage.check_eval "$RUNNER_TEMP/eval.json" "$GITHUB_WORKSPACE/ml/reports/eval.json"
        working-directory: ml
      # The browser scorer is judged on the model the parity file was made from.
      - run: npm run parity
        working-directory: web
        env:
          PARITY_MODEL: ${{ runner.temp }}/model.json
      # The full pipeline on every held-out fold (each with its own fold model) and
      # both hand-written sets: fails if any set misses more high-risk tickets,
      # flags a larger share, or has a different ticket or must-review count than
      # its recorded start point, if a set is missing, if a fold file names
      # another fold, or if the frozen fresh set changed.
      # --no: use the tsx that npm ci installed from the lockfile, never fetch one.
      - run: npm exec --no -- tsx scripts/measurePipeline.ts --folds "$RUNNER_TEMP/folds" --check
        working-directory: web

  # Builds the site from main once both checks pass, so a red commit never goes
  # live. Package install scripts run here, so this job has read access only.
  site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, model]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # The prototype and checkpoints have public links from before this deploy, so
      # they stay at the same paths. cp fails the job if the folder ever moves.
      - run: cp -r capstone web/dist/capstone
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  # The only job with write access, and it runs no repository or package code.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
