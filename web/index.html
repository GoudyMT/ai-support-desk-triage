<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>Under the Hood - AI Support Desk Triage</title>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div class="top-text">
          <h1>Under the Hood</h1>
          <p class="muted" id="seed-line"></p>
          <p class="muted" id="status"></p>
        </div>
        <p class="purpose" id="purpose">
          A live demo. Made-up support tickets go through a trained model and safety rules, and a person checks the doubtful ones. The
          model has never seen these tickets' wording.
        </p>
        <div class="top-live" id="top-live" hidden>
          <dl class="stats" id="stats"></dl>
          <button class="btn btn-link" type="button" id="more-toggle" aria-expanded="false" aria-controls="numbers">All numbers</button>
          <div class="controls" id="controls" role="group" aria-label="Run controls"></div>
        </div>
      </header>
      <section class="numbers" id="numbers" aria-label="All numbers" hidden></section>
      <p class="notice" id="notice" hidden></p>
      <p class="muted" id="loading">Loading the model...</p>
      <div class="notice error" id="load-error" hidden>
        <p id="load-error-text">The model could not be loaded.</p>
        <button class="btn" type="button" id="retry">Retry</button>
      </div>
      <main class="board show-in" id="app" hidden>
        <section class="col col-center" id="center" aria-label="Current ticket">
          <div class="stack" id="ticket"></div>
          <form class="stack" id="review" aria-label="Review this ticket" hidden></form>
        </section>
        <div class="tabs" id="tabs" role="tablist" aria-label="Ticket lists"></div>
        <section class="col col-in" id="incoming" aria-label="Coming in"></section>
        <section class="col col-out" id="outgoing" aria-label="Going out"></section>
      </main>
      <div class="sr-only" id="announcer" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/page/main.ts"></script>
  </body>
</html>
